[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openiban-eu"
version = "0.2.0"
description = "Independent IBAN validation and bank data API, starting with Germany"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "SQLAlchemy>=2.0,<3",
    "tzdata>=2024.1",
    "beautifulsoup4>=4.12,<5",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
openiban = "openiban.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
